<!-- ============================================================
  50音学堂 —— 日语50音学习网页应用
  结构：首页 / 学习 / 练习 / 测验 四个页面，底部导航切换
  样式：css/style.css
  脚本：js/ 目录下 5 个文件，按依赖顺序加载
============================================================ -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>50音学堂</title>
  <!-- 字体：优先本地圆体，其次系统日文字体（避免跨域字体加载问题） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- 应用样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header id="header">
      <h1>50音学堂</h1>
      <div id="header-right">
        <div id="streak-display"><!-- 连续学习 X 天 --></div>
        <button class="theme-btn" id="theme-toggle" title="切换夜间模式">
          <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <!-- 主内容区：4个页面容器，同时只显示一个 -->
    <main id="main">
      <!-- 首页 -->
      <div id="page-home" class="page active">
        <div class="home-left">
          <div id="progress-overview"><!-- 总进度环 + 已掌握/学习中/未学 数字 --></div>
          <div id="today-tasks"><!-- 今日任务卡片：复习X个 + 新学Y个 --></div>
        </div>
        <div id="row-map"><!-- 学习路径地图：27行按顺序排列，显示解锁状态 --></div>
      </div>

      <!-- 学习页 -->
      <div id="page-learn" class="page">
        <div id="learn-header"><!-- 当前行名 + 进度 --></div>
        <div id="kana-card-display"><!-- 假名卡片：平假名+片假名+罗马音+发音按钮 --></div>
        <div id="learn-controls"><!-- 上一个/下一个/学会了 按钮 --></div>
      </div>

      <!-- 50音表页 -->
      <div id="page-chart" class="page">
        <div id="chart-toolbar">
          <label class="switch" title="平假名片假名合并显示">
            <input type="checkbox" id="chart-merge">
            <span class="switch-track"></span>
            <span class="switch-label">合并</span>
          </label>
        </div>
        <div id="chart-tabs"><!-- 清音/浊音/拗音 切换 --></div>
        <div id="chart-table"><!-- 50音图表，点击假名发音 --></div>
      </div>

      <!-- 练习页 -->
      <div id="page-practice" class="page">
        <div id="practice-mode-switch"><!-- 正向/反向 切换 --></div>
        <div id="flashcard"><!-- 翻卡区域，点击翻面 --></div>
        <div id="practice-controls"><!-- 答对/答错 按钮 --></div>
      </div>

      <!-- 测验页 -->
      <div id="page-quiz" class="page">
        <div id="quiz-header"><!-- 第X题/共Y题 + 得分 --></div>
        <div id="quiz-question"><!-- 题目区域 --></div>
        <div id="quiz-options"><!-- 4个选项按钮 --></div>
        <div id="quiz-feedback"><!-- 答题反馈 --></div>
        <div id="quiz-result"><!-- 测验结束总结 --></div>
      </div>

      <!-- 阅读页 -->
      <div id="page-reading" class="page">
        <div id="reading-setup">
          <div id="reading-library"><!-- 内置精选文章列表 --></div>
          <details id="reading-ai-box">
            <summary class="reading-ai-summary">
              <span class="reading-ai-title">AI 生成文章</span>
              <span class="reading-ai-badge">进阶功能</span>
            </summary>
            <div id="reading-key-config"><!-- API key 配置 --></div>
            <div id="reading-tabs"><!-- 难度/主题/篇幅/形式 需求卡片 --></div>
            <button class="btn btn-primary" id="btn-reading-generate">生成文章</button>
          </details>
        </div>
        <div id="reading-view">
          <div id="reading-toolbar"><!-- 屏蔽罗马音/打字/重新生成 按钮 --></div>
          <div id="reading-article"><!-- 文章 furigana 展示 --></div>
        </div>
        <div id="reading-typing-wrap"><!-- 打字模式区（由 reading.js 填充） --></div>
      </div>
    </main>

    <!-- 底部导航栏 -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-btn" data-page="learn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.6-1.2-3.6-2-6-2H4v14h2c2.4 0 4.4.8 6 2 1.6-1.2 3.6-2 6-2h2V4h-2c-2.4 0-4.4.8-6 2z"/><path d="M12 6v14"/></svg>
        <span>学习</span>
      </button>
      <button class="nav-btn" data-page="chart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>音表</span>
      </button>
      <button class="nav-btn" data-page="practice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8a8 8 0 1 0 1 7"/><path d="M20 3v5h-5"/></svg>
        <span>练习</span>
      </button>
      <button class="nav-btn" data-page="quiz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3 21 7 8 20l-5 1 1-5L17 3z"/><path d="M14 6l4 4"/></svg>
        <span>测验</span>
      </button>
      <button class="nav-btn" data-page="reading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M7 20V4"/><path d="M18 20H7"/></svg>
        <span>阅读</span>
      </button>
    </nav>
  </div>

  <!-- 脚本按依赖顺序加载：data → storage → srs → typing → library → reading → ui → app -->
  <!-- Node 环境垫片（kuroshiro/kuromoji 打包器依赖 process.nextTick/setImmediate） -->
  <script>
    window.process = window.process || { nextTick: function (fn) { setTimeout(fn, 0); }, browser: true };
    if (!window.setImmediate) window.setImmediate = function (fn) { return setTimeout(fn, 0); };
    if (!window.clearImmediate) window.clearImmediate = function (id) { clearTimeout(id); };
  </script>
  <!-- kuroshiro 汉字注音库（离线） -->
  <script src="assets/lib/kuroshiro.min.js"></script>
  <script src="assets/lib/kuroshiro-analyzer-kuromoji.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/typing.js"></script>
  <script src="js/library.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
