<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测验页 布局调参器</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#2DD4BF; --color-primary-light:#134E4A;
  --color-card:#262626; --color-bg:#171717; --color-text:#F5F5F4;
  --color-text-secondary:#A8A29E; --color-border:#3F3F46;
  --font-kana:'M PLUS Rounded 1c','Yu Gothic','Hiragino Maru Gothic ProN',Meiryo,sans-serif;
  --font-body:-apple-system,'Microsoft YaHei','PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:#0d0d0d;color:#e7e7e7;height:100vh;overflow:hidden}

.layout{display:flex;height:100vh}

/* ---------- 左侧预览 ---------- */
.preview-wrap{flex:1;display:flex;flex-direction:column;min-width:0;background:#141414}
.preview-bar{padding:10px 16px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.preview-bar .title{font-weight:700;font-size:14px}
.preview-bar .fit{font-size:12px;padding:3px 10px;border-radius:999px;background:#1f2a28;color:#5eead4}
.preview-bar .fit.bad{background:#3a1d1d;color:#fca5a5}
.preview-bar .dim{font-size:12px;color:#8a8a8a}
.stage{flex:1;position:relative;overflow:auto;padding:20px}
.device{position:relative;transform-origin:top left;background:#171717;overflow:hidden;
  border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);border:1px solid #333}

/* ---------- 模拟 App ---------- */
.app{width:100%;height:100%;display:flex;flex-direction:column;background:#171717;color:#F5F5F4}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;
  background:#262626;border-bottom:1px solid #3F3F46;font-weight:800;color:#2DD4BF;font-size:20px;flex:0 0 auto}
.app-header .streak{font-size:13px;font-weight:700;color:#FB923C;background:#431407;padding:4px 12px;border-radius:24px}
.app-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 28px 96px}
.app-nav{position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;
  background:#262626;border-top:1px solid #3F3F46;padding:8px 12px;flex:0 0 auto}
.app-nav .item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#A8A29E}
.app-nav .item.on{color:#2DD4BF}
.app-nav .dot{width:20px;height:20px;border-radius:6px;background:currentColor;opacity:.85}

.quiz{width:100%;max-width:var(--maxw);margin:0 auto;flex:1;min-height:0;
  display:flex;flex-direction:column;justify-content:center;gap:var(--gap)}
.quiz-header{flex:0 0 auto;display:flex;justify-content:space-between;font-size:14px;color:#A8A29E}
.quiz-question{flex:0 1 auto;min-height:var(--cardminh);max-height:var(--cardmaxh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--qgap);
  background:#262626;border-radius:var(--radius);padding:16px 24px;text-align:center;overflow:hidden}
.quiz-prompt{font-size:var(--promptsize);font-weight:600;color:#A8A29E;line-height:1.4}
.kana{font-family:var(--font-kana);font-size:var(--kanasize);font-weight:700;line-height:1}
.romaji{font-size:var(--romajisize);font-weight:800;color:#2DD4BF;letter-spacing:2px;line-height:1}
.speak{width:var(--speaksize);height:var(--speaksize);border-radius:16px;background:#2DD4BF;
  display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.speak svg{width:44%;height:44%;fill:#0f2f2b}
.quiz-options{flex:0 0 auto;display:grid;gap:10px;
  grid-template-columns:repeat(var(--optcols),1fr)}
.opt{padding:var(--optpady) 12px;background:#262626;border:2px solid #3F3F46;border-radius:16px;
  font-size:var(--optsize);font-weight:700;color:#F5F5F4;font-family:var(--font-kana);cursor:pointer}
.opt:hover{border-color:#2DD4BF}

/* ---------- 右侧控件 ---------- */
.panel{width:380px;flex:0 0 auto;background:#181818;border-left:1px solid #2a2a2a;overflow-y:auto;padding:16px 18px 60px}
.panel h2{font-size:15px;margin-bottom:4px}
.panel .sub{font-size:12px;color:#8a8a8a;margin-bottom:14px;line-height:1.5}
.group{border-top:1px solid #2a2a2a;padding:14px 0}
.group:first-of-type{border-top:none}
.group h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7a7a7a;margin-bottom:10px}
.row{margin-bottom:12px}
.row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.row label b{color:#5eead4;font-variant-numeric:tabular-nums}
.row input[type=range]{width:100%;accent-color:#2DD4BF}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.presets button{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #3F3F46;
  background:#222;color:#ddd;cursor:pointer}
.presets button.on{border-color:#2DD4BF;background:#134E4A;color:#5eead4}
.types{display:flex;gap:6px;margin-bottom:12px}
.types button{flex:1;font-size:12px;padding:7px 6px;border-radius:8px;border:1px solid #3F3F46;background:#222;color:#ddd;cursor:pointer}
.types button.on{border-color:#2DD4BF;background:#134E4A;color:#5eead4}
.seg{display:flex;gap:6px}
.seg button{flex:1;font-size:13px;padding:7px;border-radius:8px;border:1px solid #3F3F46;background:#222;color:#ddd;cursor:pointer}
.seg button.on{border-color:#2DD4BF;background:#134E4A;color:#5eead4}
.out{width:100%;height:150px;background:#0f0f0f;border:1px solid #333;border-radius:8px;color:#9fe8dc;
  font-family:Consolas,monospace;font-size:11.5px;line-height:1.5;padding:10px;resize:vertical;white-space:pre}
.copy{width:100%;margin-top:8px;padding:9px;border-radius:8px;border:none;background:#2DD4BF;color:#0f2f2b;
  font-weight:800;font-size:13px;cursor:pointer}
.copy:hover{background:#5eead4}
.reset{width:100%;margin-top:6px;padding:7px;border-radius:8px;border:1px solid #3F3F46;background:#222;color:#ccc;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="layout">
  <div class="preview-wrap">
    <div class="preview-bar">
      <span class="title">测验页预览</span>
      <span class="fit" id="fitBadge">不滚动</span>
      <span class="dim" id="dimInfo"></span>
    </div>
    <div class="stage" id="stage">
      <div class="device" id="device">
        <div class="app">
          <div class="app-header"><span>50音学堂</span><span class="streak">连续学习 3 天</span></div>
          <div class="app-main">
            <div class="quiz" id="quiz">
              <div class="quiz-header"><span>第 1 题 / 共 10 题</span><span>得分：0</span></div>
              <div class="quiz-question" id="qcard">
                <div class="quiz-prompt" id="qprompt">这个假名怎么读？</div>
                <div class="kana" id="qkana">か</div>
              </div>
              <div class="quiz-options" id="qopts">
                <button class="opt">da</button><button class="opt">ka</button>
                <button class="opt">bya</button><button class="opt">ke</button>
              </div>
            </div>
          </div>
          <div class="app-nav">
            <div class="item"><span class="dot"></span>首页</div>
            <div class="item"><span class="dot"></span>学习</div>
            <div class="item"><span class="dot"></span>音表</div>
            <div class="item"><span class="dot"></span>练习</div>
            <div class="item on"><span class="dot"></span>测验</div>
            <div class="item"><span class="dot"></span>阅读</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>测验页 布局调参</h2>
    <div class="sub">拖动滑块实时预览，调好后点底部「复制参数」发我，我照这个值改回 App。</div>

    <div class="group">
      <h3>屏幕尺寸</h3>
      <div class="presets" id="presets">
        <button data-w="1920" data-h="1080">1920×1080</button>
        <button data-w="1600" data-h="900">1600×900</button>
        <button data-w="1440" data-h="900">1440×900</button>
        <button data-w="1366" data-h="768">1366×768</button>
        <button data-w="1280" data-h="720">1280×720</button>
      </div>
      <div class="row"><label>宽 <b id="vW">1920</b> px</label><input type="range" id="sW" min="1024" max="2560" step="2" value="1920"></div>
      <div class="row"><label>高 <b id="vH">1080</b> px</label><input type="range" id="sH" min="600" max="1440" step="2" value="1080"></div>
    </div>

    <div class="group">
      <h3>题型预览</h3>
      <div class="types" id="types">
        <button data-t="kana" class="on">看假名</button>
        <button data-t="listen">听发音</button>
        <button data-t="romaji">看读音</button>
      </div>
    </div>

    <div class="group">
      <h3>布局（关键）</h3>
      <div class="row"><label>内容最大宽度 <b id="vMaxw">1920</b> px</label><input type="range" id="sMaxw" min="600" max="1920" step="10" value="1920"></div>
      <div class="row"><label>题干卡片最小高度 <b id="vCardminh">380</b> px</label><input type="range" id="sCardminh" min="120" max="560" step="4" value="380"></div>
      <div class="row"><label>题干卡片最大高度 <b id="vCardmaxh">600</b> px</label><input type="range" id="sCardmaxh" min="160" max="900" step="4" value="600"></div>
      <div class="row"><label>区块间距 <b id="vGap">12</b> px</label><input type="range" id="sGap" min="0" max="48" step="1" value="12"></div>
      <div class="row"><label>主区域上下留白 <b id="vPady">24/96</b> px</label><input type="range" id="sPady" min="0" max="120" step="2" value="24"></div>
    </div>

    <div class="group">
      <h3>选项</h3>
      <div class="row"><label>一行几个</label>
        <div class="seg" id="cols"><button data-c="1">1</button><button data-c="2">2</button><button data-c="4" class="on">4</button></div>
      </div>
      <div class="row"><label>选项高度（上下内边距）<b id="vOptpad">14</b> px</label><input type="range" id="sOptpad" min="6" max="40" step="1" value="14"></div>
      <div class="row"><label>选项字号 <b id="vOptsize">20</b> px</label><input type="range" id="sOptsize" min="13" max="36" step="1" value="20"></div>
    </div>

    <div class="group">
      <h3>题干内容</h3>
      <div class="row"><label>假名字号 <b id="vKana">150</b> px</label><input type="range" id="sKana" min="40" max="220" step="2" value="150"></div>
      <div class="row"><label>罗马音字号 <b id="vRomaji">84</b> px</label><input type="range" id="sRomaji" min="20" max="120" step="2" value="84"></div>
      <div class="row"><label>喇叭按钮 <b id="vSpeak">150</b> px</label><input type="range" id="sSpeak" min="48" max="200" step="2" value="150"></div>
      <div class="row"><label>题面小字 <b id="vPrompt">15</b> px</label><input type="range" id="sPrompt" min="11" max="30" step="1" value="15"></div>
      <div class="row"><label>题面↔假名间距 <b id="vQgap">8</b> px</label><input type="range" id="sQgap" min="0" max="40" step="1" value="8"></div>
    </div>

    <div class="group">
      <h3>外观</h3>
      <div class="row"><label>卡片圆角 <b id="vRadius">24</b> px</label><input type="range" id="sRadius" min="0" max="48" step="1" value="24"></div>
    </div>

    <div class="group">
      <h3>调好的参数（发我）</h3>
      <textarea class="out" id="out" readonly></textarea>
      <button class="copy" id="copy">复制参数</button>
      <button class="reset" id="reset">恢复默认</button>
    </div>
  </div>
</div>

<script>
var DEFAULTS = {
  W:1920, H:1080, maxw:1920, cardminh:380, cardmaxh:600, gap:12, pady:24,
  optcols:4, optpad:14, optsize:20, kana:150, romaji:84, speak:150, prompt:15, qgap:8, radius:24
};
var S = Object.assign({}, DEFAULTS);
var type = 'kana';

var IDS = {
  W:'sW', H:'sH', maxw:'sMaxw', cardminh:'sCardminh', cardmaxh:'sCardmaxh', gap:'sGap', pady:'sPady',
  optpad:'sOptpad', optsize:'sOptsize', kana:'sKana', romaji:'sRomaji', speak:'sSpeak', prompt:'sPrompt',
  qgap:'sQgap', radius:'sRadius'
};
var VIDS = {
  W:'vW', H:'vH', maxw:'vMaxw', cardminh:'vCardminh', cardmaxh:'vCardmaxh', gap:'vGap',
  optpad:'vOptpad', optsize:'vOptsize', kana:'vKana', romaji:'vRomaji', speak:'vSpeak',
  prompt:'vPrompt', qgap:'vQgap', radius:'vRadius'
};

function $(id){return document.getElementById(id)}

function apply(){
  var q = $('quiz'), dev = $('device'), stage = $('stage');

  // 屏幕尺寸
  dev.style.width = S.W + 'px';
  dev.style.height = S.H + 'px';

  // 缩放以适应预览区
  var pad = 40;
  var availW = stage.clientWidth - pad, availH = stage.clientHeight - pad;
  var scale = Math.min(1, availW / S.W, availH / S.H);
  dev.style.transform = 'scale(' + scale + ')';
  stage.style.minHeight = (S.H * scale + pad) + 'px';

  // 布局变量
  q.style.setProperty('--maxw', S.maxw + 'px');
  q.style.setProperty('--cardminh', S.cardminh + 'px');
  q.style.setProperty('--cardmaxh', S.cardmaxh + 'px');
  q.style.setProperty('--gap', S.gap + 'px');
  q.style.setProperty('--qgap', S.qgap + 'px');
  q.style.setProperty('--radius', S.radius + 'px');
  q.style.setProperty('--optcols', S.optcols);
  q.style.setProperty('--optpady', S.optpad + 'px');
  q.style.setProperty('--optsize', S.optsize + 'px');
  q.style.setProperty('--kanasize', S.kana + 'px');
  q.style.setProperty('--romajisize', S.romaji + 'px');
  q.style.setProperty('--speaksize', S.speak + 'px');
  q.style.setProperty('--promptsize', S.prompt + 'px');

  var main = document.querySelector('.app-main');
  main.style.padding = S.pady + 'px 28px 96px';

  // 数值标签
  for (var k in VIDS) if ($(VIDS[k])) $(VIDS[k]).textContent = S[k];
  $('vPady').textContent = S.pady + '/96';

  // 题型
  renderType();

  // 是否溢出（用未缩放的 scrollHeight 判断）
  var app = document.querySelector('.app');
  var overflow = app.scrollHeight > S.H + 1;
  var badge = $('fitBadge');
  badge.textContent = overflow ? '需要滚动' : '不滚动';
  badge.className = 'fit' + (overflow ? ' bad' : '');
  $('dimInfo').textContent = '屏幕 ' + S.W + '×' + S.H + '　显示缩放 ' + Math.round(scale*100) + '%';

  // 输出
  $('out').value = buildOut();
}

function renderType(){
  var p = $('qprompt'), k = $('qkana');
  var card = $('qcard');
  // 清掉可能存在的喇叭
  var old = card.querySelector('.speak'); if (old) old.remove();
  if (type === 'kana'){
    p.textContent = '这个假名怎么读？'; k.style.display=''; k.textContent = 'か';
  } else if (type === 'romaji'){
    p.textContent = 'ka 是哪个假名？'; k.style.display=''; k.className='romaji'; k.textContent='ka';
  } else {
    p.textContent = '听发音，选假名'; k.style.display='none';
    var b = document.createElement('button'); b.className='speak';
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    card.appendChild(b);
  }
  if (type !== 'romaji') k.className = 'kana';
}

function buildOut(){
  return '测验页布局参数：\n' +
    '屏幕            ' + S.W + ' x ' + S.H + '\n' +
    '内容最大宽度     ' + S.maxw + 'px\n' +
    '题干卡片最小高   ' + S.cardminh + 'px\n' +
    '题干卡片最大高   ' + S.cardmaxh + 'px\n' +
    '区块间距         ' + S.gap + 'px\n' +
    '主区上下留白     ' + S.pady + 'px / 96px\n' +
    '选项列数         ' + S.optcols + '\n' +
    '选项高度(内边距) ' + S.optpad + 'px\n' +
    '选项字号         ' + S.optsize + 'px\n' +
    '假名字号         ' + S.kana + 'px\n' +
    '罗马音字号       ' + S.romaji + 'px\n' +
    '喇叭按钮         ' + S.speak + 'px\n' +
    '题面小字         ' + S.prompt + 'px\n' +
    '题面↔假名间距    ' + S.qgap + 'px\n' +
    '卡片圆角         ' + S.radius + 'px';
}

// 绑定滑块
Object.keys(IDS).forEach(function(k){
  var el = $(IDS[k]);
  if (!el) return;
  el.addEventListener('input', function(){
    S[k] = parseInt(el.value, 10);
    // 预设高亮取消（尺寸手改后）
    if (k === 'W' || k === 'H') markPreset(null);
    apply();
  });
});

// 列数
Array.prototype.forEach.call(document.querySelectorAll('#cols button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#cols button'), function(x){x.classList.remove('on')});
    b.classList.add('on');
    S.optcols = parseInt(b.getAttribute('data-c'), 10);
    apply();
  });
});

// 题型
Array.prototype.forEach.call(document.querySelectorAll('#types button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#types button'), function(x){x.classList.remove('on')});
    b.classList.add('on');
    type = b.getAttribute('data-t');
    apply();
  });
});

// 屏幕预设
function markPreset(btn){
  Array.prototype.forEach.call(document.querySelectorAll('#presets button'), function(x){
    x.classList.toggle('on', x === btn);
  });
}
Array.prototype.forEach.call(document.querySelectorAll('#presets button'), function(b){
  b.addEventListener('click', function(){
    S.W = parseInt(b.getAttribute('data-w'),10);
    S.H = parseInt(b.getAttribute('data-h'),10);
    $('sW').value = S.W; $('sH').value = S.H;
    // 最大宽度跟随屏幕（满宽）
    if (S.maxw === DEFAULTS.maxw || S.maxw >= 1900) { S.maxw = S.W; $('sMaxw').value = S.W; }
    markPreset(b);
    apply();
  });
});

$('copy').addEventListener('click', function(){
  var t = $('out'); t.select(); t.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); } catch(e){}
  var btn = $('copy'); btn.textContent = '已复制 ✓'; setTimeout(function(){ btn.textContent='复制参数'; }, 1200);
});

$('reset').addEventListener('click', function(){
  S = Object.assign({}, DEFAULTS);
  Object.keys(IDS).forEach(function(k){ if ($(IDS[k])) $(IDS[k]).value = S[k]; });
  Array.prototype.forEach.call(document.querySelectorAll('#cols button'), function(x){ x.classList.toggle('on', x.getAttribute('data-c')==='4'); });
  Array.prototype.forEach.call(document.querySelectorAll('#types button'), function(x){ x.classList.toggle('on', x.getAttribute('data-t')==='kana'); });
  type='kana'; markPreset(document.querySelector('#presets button'));
  apply();
});

window.addEventListener('resize', apply);
markPreset(document.querySelector('#presets button'));
apply();
</script>
</body>
</html>
